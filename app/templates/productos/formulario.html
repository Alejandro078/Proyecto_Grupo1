{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if producto else 'Nuevo' }} producto{% endblock %}
{% block contenido %}
<h3 class="fw-bold text-navy mb-3">{{ 'Editar producto' if producto else 'Nuevo producto' }}</h3>

<div class="card p-4" style="max-width: 680px;">
    <form method="post">
        <div class="mb-3">
            <label class="form-label">Nombre *</label>
            <input type="text" class="form-control" name="nombre" required
                   value="{{ producto.nombre if producto else '' }}">
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Categoría</label>
                <input type="text" class="form-control" name="categoria"
                       value="{{ producto.categoria if producto else '' }}" placeholder="Ej: Accesorios">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Precio *</label>
                <input type="number" step="0.01" min="0.01" class="form-control" name="precio" required
                       value="{{ producto.precio if producto else '' }}">
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Stock inicial</label>
                <input type="number" min="0" class="form-control" name="stock"
                       value="{{ producto.stock if producto else 0 }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Stock mínimo (alerta)</label>
                <input type="number" min="0" class="form-control" name="stock_minimo"
                       value="{{ producto.stock_minimo if producto else 5 }}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" name="descripcion" rows="2">{{ producto.descripcion if producto else '' }}</textarea>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-navy" type="submit"><i class="bi bi-check-lg me-1"></i>Guardar</button>
            <a href="{{ url_for('productos.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
