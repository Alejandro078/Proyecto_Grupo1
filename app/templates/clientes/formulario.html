{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if cliente else 'Nuevo' }} cliente{% endblock %}
{% block contenido %}
<h3 class="fw-bold text-navy mb-3">{{ 'Editar cliente' if cliente else 'Nuevo cliente' }}</h3>

<div class="card p-4" style="max-width: 680px;">
    <form method="post">
        <div class="row">
            <div class="col-md-7 mb-3">
                <label class="form-label">Nombre completo *</label>
                <input type="text" class="form-control" name="nombre" required
                       value="{{ cliente.nombre if cliente else '' }}">
            </div>
            <div class="col-md-5 mb-3">
                <label class="form-label">Documento *</label>
                <input type="text" class="form-control" name="documento" required
                       value="{{ cliente.documento if cliente else '' }}">
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email"
                       value="{{ cliente.email if cliente else '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" class="form-control" name="telefono"
                       value="{{ cliente.telefono if cliente else '' }}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Dirección</label>
            <input type="text" class="form-control" name="direccion"
                   value="{{ cliente.direccion if cliente else '' }}">
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-navy" type="submit"><i class="bi bi-check-lg me-1"></i>Guardar</button>
            <a href="{{ url_for('clientes.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
